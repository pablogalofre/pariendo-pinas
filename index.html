<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Pariendo Piñas — Tropical Luxury From Colombia</title>

<link rel="icon" type="image/png" href="./images/favicon.png" />
<link rel="apple-touch-icon" href="./images/favicon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --dark:#031812;
  --dark2:#061f18;
  --green:#082d22;
  --gold:#c49a3d;
  --gold2:#e0bf70;
  --cream:#f1e6cf;
  --paper:#f8f1e3;
  --white:#fff8ea;
  --muted:#b9ad96;
  --ink:#15271f;
  --line:rgba(196,154,61,.32);
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:'Inter',sans-serif;
  background:var(--dark);
  color:var(--cream);
  overflow-x:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

img{
  max-width:100%;
  display:block;
}

/* =========================
   NAV
   ========================= */

.nav{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:50;
  padding:28px 5vw;
  display:flex;
  justify-content:space-between;
  align-items:center;

  background:
    linear-gradient(
      to bottom,
      rgba(3,24,18,.86),
      rgba(3,24,18,.34),
      transparent
    );
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.brand-mark{
  width:38px;
  height:52px;
  position:relative;
  display:grid;
  place-items:center;
  color:var(--gold);

  font-family:'Cormorant Garamond',serif;
  font-size:34px;
}

.brand-mark::before{
  content:"✦";
  position:absolute;
  top:-14px;
  font-size:15px;
  color:var(--gold2);
}

.brand-name{
  color:var(--gold2);
  letter-spacing:7px;
  font-size:13px;
  text-transform:uppercase;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:36px;

  color:var(--white);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:4px;
}

.private-link{
  border:1px solid var(--line);
  padding:14px 20px;
  color:var(--gold2);
  background:rgba(3,24,18,.28);
}

/* =========================
   HERO
   ========================= */

.hero{
  min-height:100vh;

  position:relative;

  display:flex;
  align-items:center;

  padding:130px 7vw 70px;

  background:
    linear-gradient(
      90deg,
      rgba(3,24,18,.96) 0%,
      rgba(3,24,18,.72) 34%,
      rgba(3,24,18,.18) 69%,
      rgba(3,24,18,.05) 100%
    ),

    url("./images/login-luxury.png");

  background-size:cover;
  background-position:center center;
}

.hero-content{
  position:relative;
  z-index:2;
  max-width:720px;
}

.kicker{
  color:var(--gold2);
  letter-spacing:7px;
  text-transform:uppercase;
  font-size:12px;
  margin-bottom:24px;
}

.hero h1{
  font-family:'Cormorant Garamond',serif;
  font-size:100px;
  line-height:.86;
  font-weight:400;

  color:var(--white);

  margin-bottom:30px;
}

.hero-line{
  width:64px;
  height:1px;
  background:var(--gold);

  margin:0 0 26px;
}

.hero p{
  max-width:500px;

  color:rgba(255,248,234,.78);

  font-size:16px;
  line-height:1.9;
}

.btn{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  min-height:52px;

  padding:0 28px;

  border:1px solid var(--line);

  color:var(--gold2);

  letter-spacing:4px;
  text-transform:uppercase;
  font-size:11px;
  font-weight:700;

  background:rgba(3,24,18,.24);

  margin-top:36px;
}

/* =========================
   CONTINÚA...
   ========================= */

</style>
</head>

<body>

<header class="nav">

  <a class="brand" href="#">
    <div class="brand-mark">PP</div>
    <div class="brand-name">
      Pariendo Piñas
    </div>
  </a>

  <nav class="nav-links">
    <a href="#produce">Produce</a>
    <a href="#lifestyle">Lifestyle</a>
    <a href="#objects">Objects</a>
    <a href="#world">Our World</a>

    <a class="private-link" href="admin.html">
      Investors ◆
    </a>
  </nav>

</header>

<section class="hero">

  <div class="hero-content">

    <div class="kicker">
      Tropical luxury from Colombia
    </div>

    <h1>
      Luxury<br>
      Tropical<br>
      House.
    </h1>

    <div class="hero-line"></div>

    <p>
      Más que piñas.
      Somos produce, lifestyle,
      objetos y experiencias creadas
      para una vida más cálida.
    </p>

    <a class="btn" href="#drops">
      Explora nuestro mundo ◆
    </a>

  </div>

</section>
