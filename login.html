<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Pariendo Piñas — Private Access</title>

<link rel="icon" type="image/png" href="./images/favicon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --black:#061510;
  --gold:#c7a04c;
  --gold-soft:#e3c57f;
  --cream:#f4ead6;
}

body{
  min-height:100vh;

  font-family:'Inter',sans-serif;

  background:
    linear-gradient(
      90deg,
      rgba(6,21,16,.96),
      rgba(6,21,16,.72),
      rgba(6,21,16,.24)
    ),
    url("./images/login-luxury.png");

  background-size:cover;
  background-position:center;

  display:flex;
  align-items:center;
  justify-content:flex-end;

  padding:60px 7vw;
}

.login-card{
  width:100%;
  max-width:430px;

  background:rgba(248,242,231,.94);

  border-radius:34px;

  padding:42px 38px;

  box-shadow:0 34px 90px rgba(0,0,0,.28);
}

.mark{
  text-align:center;

  font-family:'Cormorant Garamond',serif;

  color:var(--gold);

  font-size:42px;

  margin-bottom:18px;
}

h1{
  text-align:center;

  font-family:'Cormorant Garamond',serif;

  font-size:42px;

  font-weight:400;

  color:#09231a;
}

.kicker{
  text-align:center;

  color:var(--gold);

  letter-spacing:6px;

  text-transform:uppercase;

  font-size:11px;

  margin:12px 0 28px;
}

p{
  text-align:center;

  color:#7a715f;

  line-height:1.7;

  font-size:14px;

  margin-bottom:28px;
}

label{
  display:block;

  font-size:13px;

  font-weight:700;

  color:#09231a;

  margin-bottom:8px;
}

input{
  width:100%;
  height:52px;

  border-radius:16px;

  border:1px solid rgba(9,35,26,.16);

  padding:0 18px;

  font-size:15px;

  margin-bottom:18px;

  outline:none;
}

button{
  width:100%;
  height:54px;

  border:0;

  border-radius:999px;

  background:#09231a;

  color:var(--cream);

  font-weight:800;

  font-size:15px;

  cursor:pointer;
}

.error{
  display:none;

  margin-top:16px;

  text-align:center;

  color:#a02020;

  font-size:13px;

  font-weight:700;
}

.back{
  display:block;

  margin-top:24px;

  text-align:center;

  color:var(--gold);

  font-size:12px;

  letter-spacing:3px;

  text-transform:uppercase;
}

@media(max-width:800px){

  body{
    justify-content:center;

    padding:28px;

    background:
      linear-gradient(
        to bottom,
        rgba(6,21,16,.18),
        rgba(6,21,16,.86)
      ),
      url("./images/login-luxury.png");

    background-size:cover;
    background-position:center;
  }

  .login-card{
    padding:34px 26px;
  }

}

</style>
</head>

<body>

<section class="login-card">

  <div class="mark">PP</div>

  <h1>Acceso privado</h1>

  <div class="kicker">
    Brand Command Center
  </div>

  <p>
    Ingreso exclusivo para operación interna,
    socios e inversionistas.
  </p>

  <label>Usuario</label>

  <input
    id="loginUser"
    type="text"
    placeholder="Usuario"
  />

  <label>Contraseña</label>

  <input
    id="loginPass"
    type="password"
    placeholder="Contraseña"
  />

  <button onclick="loginPP()">
    Entrar
  </button>

  <div id="loginError" class="error">
    Usuario o contraseña incorrectos.
  </div>

  <a class="back" href="index.html">
    Volver al home
  </a>

</section>

<script>

function loginPP(){

  const user =
    document
      .getElementById("loginUser")
      .value
      .trim()
      .toLowerCase();

  const pass =
    document
      .getElementById("loginPass")
      .value
      .trim();

  const validUsers = {

    pablo: "pariendo2026",

    andres: "pariendo2026"

  };

  if(validUsers[user] &&
     validUsers[user] === pass){

      localStorage.setItem(
        "pp_user",
        user
      );

      window.location.href =
        "admin.html";

      return;
  }

  document
    .getElementById("loginError")
    .style.display = "block";
}

document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){
      loginPP();
    }

});

</script>

</body>
</html>
